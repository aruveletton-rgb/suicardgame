global_rules:
  source_asset: "8528700881491428f2e83d277561869d.jpg"
  sui_rank_protection:
    summary: "When another player uses a Sui card and you would be selected/affected, you may discard a higher-rank Sui card on your turn to avoid that Sui card's effect."
    interrupt_priority: "rank ordered by Sui hierarchy; exact simultaneous ordering not specified by card image"

special_cards:
  - id: "wang"
    name: "望牌"
    source_asset: "15aefb709c02084fbf08600c51e42d85.jpg"
    playable_timing: "Immediately when another player cannot play a legal/reasonable card."
    active_or_passive: "passive_interrupt_control"
    target_type: "one blocked player, then subsequent players until controller's own turn begins"
    required_player_choice: ["target player when condition is met", "whether/how to play while controlling"]
    immediate_effect: "Inspect target hand and control target player's game actions; controller's own hand is also treated as target-available hand."
    delayed_effect: "Continue controlling following players until controller's own turn begins."
    modifies_global_rules: false
    interrupt_priority: "Sui reaction; affected players may use higher-rank protection if eligible."
    can_stack_or_chain: "UNCERTAIN; card image does not define multiple Wang or reaction ordering."
    counter_or_question_rule: "Subject to higher-rank Sui protection and end-turn 有岁 question."
    frontend_required_prompt: ["blocked-player detection", "controller hand+target hand merged view", "controlled action UI", "affected player notification"]
    backend_state_changes: ["pending/control owner", "controlled player id", "merged legal hand view", "turn progression until controller's turn"]
    test_scenarios:
      - "When target has no legal color/number play, Wang can create control state."
      - "Controller can choose no play while controlling another player."
      - "Control ends when controller's own turn begins."

  - id: "ji"
    name: "绩牌"
    source_asset: "1da5cef571c0302eb77b09e1fe9bbe96.jpg"
    playable_timing: "On user's own turn."
    active_or_passive: "active"
    target_type: "all other players in play order, then user"
    required_player_choice: ["declared color", "each other player's number/cards to discard", "user discard count up to total"]
    immediate_effect: "Declare a color; other players may discard any number of that color in order."
    delayed_effect: "User may discard no more than the total discarded by others."
    modifies_global_rules: false
    interrupt_priority: "main-turn Sui effect; affected players may use higher-rank protection if eligible."
    can_stack_or_chain: "No stacking rule specified by image."
    counter_or_question_rule: "Subject to higher-rank Sui protection and end-turn 有岁 question."
    frontend_required_prompt: ["color choice", "per-player discard selection", "user capped discard selection"]
    backend_state_changes: ["pending color", "per-player response order", "discard pile updates", "hand count updates"]
    test_scenarios:
      - "Declared color limits all discard selections."
      - "User cannot discard more than total discarded by others."

  - id: "yu"
    name: "余牌"
    source_asset: "23db64326534b6478c57bae78d1c1590.jpg"
    playable_timing: "On user's own turn."
    active_or_passive: "active_multi_step"
    target_type: "all other players in order"
    required_player_choice: ["user pays four different-color cards", "each target discards an unused color or declines", "user chooses restart/stop after decline"]
    immediate_effect: "User discards four cards with all different colors."
    delayed_effect: "Targets discard one card whose color has not appeared earlier in that effect round; user may restart from a declining player by paying again."
    modifies_global_rules: false
    interrupt_priority: "main-turn Sui effect; affected players may use higher-rank protection if eligible."
    can_stack_or_chain: "Can repeat by explicit restart payment."
    counter_or_question_rule: "Subject to higher-rank Sui protection and end-turn 有岁 question."
    frontend_required_prompt: ["four-color payment selector", "per-target legal-color selector", "restart confirmation"]
    backend_state_changes: ["effect round colors", "current responder index", "payment tracking", "discard pile updates"]
    test_scenarios:
      - "Reject payment unless four different colors are selected."
      - "Decline allows user to restart from declining player after another valid payment."

  - id: "yi"
    name: "易牌"
    source_asset: "23f1f0c5d35242bc5a52bba759946770.jpg"
    playable_timing: "On user's own turn."
    active_or_passive: "active_repeatable"
    target_type: "all other players"
    required_player_choice: ["two number cards summing to 8"]
    immediate_effect: "User discards two number cards whose values sum to 8; all other players draw one card in order."
    delayed_effect: "May be repeated multiple times during the same turn."
    modifies_global_rules: false
    interrupt_priority: "main-turn Sui effect; affected players may use higher-rank protection if eligible."
    can_stack_or_chain: "Repeatable in same turn."
    counter_or_question_rule: "Subject to higher-rank Sui protection and end-turn 有岁 question."
    frontend_required_prompt: ["two-card sum-to-8 selector", "repeat action affordance"]
    backend_state_changes: ["discard selected pair", "draw one for each other player", "track repeated use in same turn"]
    test_scenarios:
      - "Reject non-number or non-sum-8 pair."
      - "Each other player draws exactly one per successful execution."

  - id: "zuole"
    name: "左乐牌"
    source_asset: "2f42240353fbe94ad44e1ee11070299b.jpg"
    playable_timing: "When anyone uses a Sui card."
    active_or_passive: "passive_response"
    target_type: "one chosen player, including self"
    required_player_choice: ["protected target player"]
    immediate_effect: "Chosen player is unaffected by that Sui card effect for this turn."
    delayed_effect: "Protection lasts for this turn/effect only."
    modifies_global_rules: false
    interrupt_priority: "reaction to Sui use; exact ordering with rank protection is not specified by card image."
    can_stack_or_chain: "UNCERTAIN; multiple Zuole interactions not specified."
    counter_or_question_rule: "Subject to end-turn 有岁 question."
    frontend_required_prompt: ["reaction window", "target player selector"]
    backend_state_changes: ["effect immunity marker scoped to source Sui effect and target player"]
    test_scenarios:
      - "Zuole target is excluded from current Sui effect."
      - "Protection does not persist beyond the current turn/effect."

  - id: "xi"
    name: "夕牌"
    source_asset: "3e25cb360344c2f96a7120b0bdc36335.jpg"
    playable_timing: "When passively required to provide/use a card."
    active_or_passive: "passive_substitution"
    target_type: "the pending required card/action"
    required_player_choice: ["choose Xi as substitute for required card"]
    immediate_effect: "Treat Xi as any required card for passive card-game actions, including discard/play/use/reveal, then immediately discard Xi."
    delayed_effect: "None."
    modifies_global_rules: false
    interrupt_priority: "response inside passive requirement window."
    can_stack_or_chain: "No chaining rule specified."
    counter_or_question_rule: "Subject to end-turn 有岁 question."
    frontend_required_prompt: ["passive requirement prompt", "Xi substitute button"]
    backend_state_changes: ["consume Xi from hand", "satisfy pending requirement", "discard Xi"]
    test_scenarios:
      - "Xi can satisfy a color discard requirement."
      - "Xi is discarded after substitution and does not trigger active effect."

  - id: "nian"
    name: "年牌"
    source_asset: "3f72b366c71fa69b00332f2787dc2079.jpg"
    playable_timing: "When a Chi/Peng/Gang opportunity appears on table."
    active_or_passive: "active_global_rule_unlock"
    target_type: "global game rules"
    required_player_choice: ["announce Chi, Peng, or Gang when opportunity appears"]
    immediate_effect: "Immediately announce and resolve Chi/Peng/Gang opportunity."
    delayed_effect: "Adds Mo/Chi/Peng/Gang rules for this game."
    modifies_global_rules: true
    interrupt_priority: "opportunity window; card image does not define conflict priority beyond named actions."
    can_stack_or_chain: "Global rule is game-scoped; repeated Nian after enabled is UNCERTAIN."
    counter_or_question_rule: "Subject to higher-rank Sui protection if a player is affected and end-turn 有岁 question."
    frontend_required_prompt: ["Chi/Peng/Gang opportunity prompt", "turn-start draw and turn-end discard prompts after enabled"]
    backend_state_changes: ["nian_rules_enabled", "turn_start_draw requirement", "turn_end_discard requirement", "claim windows for chi/peng/gang", "turn jump on peng/gang"]
    test_scenarios:
      - "After Nian, ordinary turn start requires draw unless entered by Chi/Peng/Gang."
      - "Peng/Gang can jump turn to claimant and skip draw phase."

  - id: "sui_xiang"
    name: "岁相牌"
    source_asset: "55c25e3116be272c57ed9a955bafcd73.jpg"
    playable_timing: "When seen by any player."
    active_or_passive: "passive_on_seen"
    target_type: "all players in order"
    required_player_choice: ["first observer flips deck card", "each player discards matching color or draws four"]
    immediate_effect: "Flip deck top until a colored card appears."
    delayed_effect: "Players in order discard a card matching flipped color; otherwise draw four."
    modifies_global_rules: false
    interrupt_priority: "on-seen trigger; exact definition of seen source is not specified by image."
    can_stack_or_chain: "UNCERTAIN; repeated seen triggers not specified."
    counter_or_question_rule: "Xi may satisfy required card; subject to end-turn 有岁 question."
    frontend_required_prompt: ["reveal trigger display", "matching-color discard prompt", "draw-four result display"]
    backend_state_changes: ["reveal deck until colored", "current required color", "per-player response order", "draw penalties"]
    test_scenarios:
      - "Non-colored reveal repeats until colored."
      - "Player without matching color draws four."

  - id: "shu"
    name: "黍牌"
    source_asset: "941e81d9c480f062462aed1364e55ad1.jpg"
    playable_timing: "On user's own turn when one hand color count is >= number of other players."
    active_or_passive: "active_distribution"
    target_type: "all other players"
    required_player_choice: ["chosen color", "remainder recipient among current fewest-hand players if needed"]
    immediate_effect: "Distribute all cards of chosen color evenly to other players."
    delayed_effect: "Remainder goes to one of the players with the fewest cards at that time."
    modifies_global_rules: false
    interrupt_priority: "main-turn Sui effect; affected players may use higher-rank protection if eligible."
    can_stack_or_chain: "No stacking rule specified."
    counter_or_question_rule: "Subject to higher-rank Sui protection and end-turn 有岁 question."
    frontend_required_prompt: ["eligible color selector", "remainder recipient selector if ambiguous"]
    backend_state_changes: ["move chosen color cards from user to other players", "hand count updates"]
    test_scenarios:
      - "Reject color count below number of other players."
      - "Even distribution and remainder recipient are correct."

  - id: "chongyue"
    name: "重岳牌"
    source_asset: "9bf6f1118300add4e001671f90641b5d.jpg"
    playable_timing: "On user's own turn."
    active_or_passive: "active_reveal_challenge"
    target_type: "all players, then challengers against user"
    required_player_choice: ["each player's four different-color display", "challenge/decline after own display phase"]
    immediate_effect: "All players in play order display four different-color hand cards; if color is insufficient, draw and display until complete."
    delayed_effect: "Other players may question user after their own display phase; pass makes challenger draw 4, fail makes user draw/display until complete and stops effect."
    modifies_global_rules: false
    interrupt_priority: "main-turn Sui effect with embedded challenge windows."
    can_stack_or_chain: "No stacking rule specified."
    counter_or_question_rule: "Specific challenge rule on card; also subject to end-turn 有岁 question."
    frontend_required_prompt: ["four-color reveal selector", "draw/reveal progress", "challenge prompt", "challenge result display"]
    backend_state_changes: ["reveal areas", "per-player display state", "challenge state", "draw penalties or early stop"]
    test_scenarios:
      - "Player with insufficient colors draws until four colors displayed."
      - "Successful challenge stops effect and makes user draw/display to complete."
      - "Failed challenge makes challenger draw four."

  - id: "ling"
    name: "令牌"
    source_asset: "a096ad301444ccefec6871995adafdef.jpg"
    playable_timing: "On user's own turn."
    active_or_passive: "active_equalize_hand_count"
    target_type: "all players"
    required_player_choice: []
    immediate_effect: "Snapshot current maximum hand count among all players, then every player below that count draws until equal. User is included."
    delayed_effect: "None after draw completion."
    modifies_global_rules: false
    interrupt_priority: "main-turn Sui effect; affected players may use higher-rank protection if eligible."
    can_stack_or_chain: "No stacking rule specified."
    counter_or_question_rule: "Subject to higher-rank Sui protection and end-turn 有岁 question."
    frontend_required_prompt: ["effect confirmation", "draw result summary"]
    backend_state_changes: ["snapshot max hand count", "draw for each player below max"]
    test_scenarios:
      - "All players end with original maximum hand count."
      - "User draws only if below maximum."

  - id: "cannot"
    name: "坎诺特牌"
    source_asset: "ddc008e08c2dc031c8a7f115a3832c43.jpg"
    playable_timing: "Before game starts as field NPC; shop actions during own turn."
    active_or_passive: "field_shop"
    target_type: "shop goods"
    required_player_choice: ["buy selected good", "payment card", "refresh shop once per own turn"]
    immediate_effect: "Before game starts, place CANNOT on field and place 8 cards around it as goods."
    delayed_effect: "Each turn, player may buy one matching-color/number good by discarding a colored card, may buy non-colored good by discarding any card, and may refresh shop once on own turn replacing 8 goods."
    modifies_global_rules: true
    interrupt_priority: "field/shop action during own turn."
    can_stack_or_chain: "One buy and one refresh per player turn according to image."
    counter_or_question_rule: "Not a Sui hierarchy card; no rank protection specified."
    frontend_required_prompt: ["shop goods display", "payment selector", "refresh shop button with once-per-turn state"]
    backend_state_changes: ["field_card", "shop.goods", "bought_this_turn_by", "refreshed_this_turn_by", "discard payment", "move good to hand"]
    test_scenarios:
      - "Shop starts with 8 goods."
      - "Colored payment can buy same color or same number good."
      - "Refresh is limited to once per own turn."

  - id: "fuzhou"
    name: "符咒牌"
    source_asset: "df61e38b7181b20ff352318a5f70a267.jpg"
    playable_timing: "Immediately when drawn by a player."
    active_or_passive: "passive_on_draw"
    target_type: "drawer and all other players in order"
    required_player_choice: ["each other player may give one hand card or decline"]
    immediate_effect: "When drawn, all players in order may give the drawer one hand card."
    delayed_effect: "After gift window, discard Fuzhou card."
    modifies_global_rules: false
    interrupt_priority: "on-draw trigger; exact order begins after drawer, card image says all players in order."
    can_stack_or_chain: "UNCERTAIN; multiple Fuzhou drawn interactions not specified."
    counter_or_question_rule: "Subject to end-turn 有岁 question."
    frontend_required_prompt: ["on-draw trigger notice", "give-card/decline prompt for each player", "drawer receipt summary"]
    backend_state_changes: ["pending gift order", "move gifted cards", "discard Fuzhou"]
    test_scenarios:
      - "Drawing Fuzhou opens gift prompt instead of adding it as ordinary hand card."
      - "After all responses, Fuzhou is discarded."
